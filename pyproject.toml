[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
    "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "parsec-accelerated-native"
version = "0.6.1"
description = "Optional C++/OpenMP kernels for the canonical PARSEC Python solver"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.source-dir = "src/parsec_python/acceleration/native"
wheel.packages = []
cmake.args = ["-G", "Ninja"]
