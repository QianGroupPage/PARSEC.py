[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parsec-py"
version = "0.1.0"
description = "Python-based real-space Kohn-Sham DFT accelerated by machine-learned charge density"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Extra runtime dependencies of the legacy `old_architecture` workflows.
legacy = ["pandas", "matplotlib"]

[project.scripts]
parsec-py = "new_architecture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["new_architecture*", "old_architecture*"]
# The test suite asserts on repository layout (ARCHITECTURE.md, benchmarks/)
# and so only runs from a source checkout. Keep it out of the wheel rather
# than shipping benchmark pseudopotentials to every installed user.
exclude = ["new_architecture.tests", "new_architecture.tests.*"]

[tool.setuptools.package-data]
# Resource files that are loaded relative to the module that reads them, and
# so must travel with the installed package rather than the source tree.
"old_architecture" = ["elements_new.csv"]
"old_architecture.V_ion" = ["splineData.mat"]
"new_architecture.provenance" = ["source_map.json"]
